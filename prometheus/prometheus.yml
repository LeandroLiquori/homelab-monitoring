global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
     - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
     - targets: ['node-exporter:9100']

  - job_name: 'pc-linux'
    static_configs:
      - targets: ['192.168.0.15:9100']

  - job_name: 'pc-windows'
    static_configs:
      - targets: ['192.168.0.35:9182']
